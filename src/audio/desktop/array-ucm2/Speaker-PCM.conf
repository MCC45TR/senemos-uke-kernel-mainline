# Preserve all four application channels on the dedicated speaker PCM.
pcm.uke_speakers {
	@args [ CARD ]
	@args.CARD.type string
	type plug
	slave {
		# Negotiate S16_LE/S24_LE/S32_LE with this kernel's speaker frontend.
		# The backend MFC retains the fixed hardware transport profile.
		rate 48000
		channels 4
		pcm { @func concat strings [ "hw:" $CARD ",1" ] }
	}
}
