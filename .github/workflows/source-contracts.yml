name: Source contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: bash -n packaging/rpm/kernel/build-srpm.sh
      - run: bash -n tools/release/normal-kernel-release.sh
      - run: make validate
